<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Runner Platformer</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Deixa os cliques passarem para a tela de start */
        }

        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #health-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .heart {
            width: 25px;
            height: 25px;
            background-color: #ff3333;
            border: 2px solid #fff;
            border-radius: 4px;
            transform: rotate(45deg);
        }

        .heart.empty {
            background-color: transparent;
            border-color: #777;
        }

        /* Telas de Menu e Game Over */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 48px;
            color: #4da6ff;
            text-shadow: 3px 3px 0 #000;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #ccc;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }

        .controls-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        
        .controls-info ul {
            list-style: none;
            padding: 0;
        }

        .controls-info li {
            margin-bottom: 8px;
        }

        .btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            background-color: #4da6ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 0 #0066cc;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #0066cc;
        }
        
        .btn:hover {
            background-color: #66b3ff;
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud" id="hud" style="display: none;">
            <div id="score">Distância: 0m</div>
            <div id="health-bar">
                <div class="heart"></div>
                <div class="heart"></div>
                <div class="heart"></div>
            </div>
        </div>
    </div>

    <!-- Tela Inicial -->
    <div id="startScreen" class="overlay">
        <h1>Neon Runner</h1>
        <div class="controls-info">
            <p><strong>Controles:</strong></p>
            <ul>
                <li>⬅️ ➡️ : Mover Esquerda / Direita</li>
                <li>⬆️ : Pular</li>
                <li>⬇️ : Agachar</li>
                <li>[ESPAÇO] : Atacar (Cria área de dano na frente)</li>
            </ul>
        </div>
        <button class="btn" id="startBtn">JOGAR</button>
    </div>

    <!-- Tela de Game Over -->
    <div id="gameOverScreen" class="overlay hidden">
        <h1 style="color: #ff3333;">FIM DE JOGO</h1>
        <p id="finalScore" style="font-size: 24px; color: #fff;">Distância: 0m</p>
        <button class="btn" id="restartBtn">TENTAR NOVAMENTE</button>
    </div>

    <script>
        // ==========================================
        // SISTEMA DE ÁUDIO (Web Audio API)
        // Sintetiza todos os sons sem arquivos externos
        // ==========================================
        const audio = {
            ctx: null,
            bgmInterval: null,
            bgmStep: 0,
            isPlaying: false,

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            playTone(freq, type, duration, vol = 0.1) {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                
                gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
                return osc;
            },

            jump() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            },

            attack() {
                this.playTone(800, 'sawtooth', 0.1, 0.1);
            },

            crouch() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.1);
            },

            hit() {
                // Som dissonante para dano recebido
                this.playTone(100, 'sawtooth', 0.3, 0.2);
                this.playTone(110, 'square', 0.3, 0.2);
            },

            enemyDeath() {
                // Som agudo de explosãozinha
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            },

            startBGM() {
                if (this.bgmInterval) return;
                this.isPlaying = true;
                // Melodia simples em loop
                const melody = [
                    220, 220, 330, 220, 
                    440, 330, 220, 164,
                    220, 220, 330, 220,
                    440, 493, 440, 330
                ];
                const bass = [
                    110, 110, 110, 110,
                    82.4, 82.4, 82.4, 82.4
                ];
                
                this.bgmInterval = setInterval(() => {
                    if (!this.isPlaying) return;
                    // Toca a melodia
                    let mFreq = melody[this.bgmStep % melody.length];
                    if (mFreq) this.playTone(mFreq, 'square', 0.15, 0.03);
                    
                    // Toca o baixo (mais lento)
                    if (this.bgmStep % 2 === 0) {
                        let bFreq = bass[Math.floor((this.bgmStep/2) % bass.length)];
                        this.playTone(bFreq, 'triangle', 0.3, 0.05);
                    }
                    
                    this.bgmStep++;
                }, 150); // 150ms per step (aprox 100 BPM 16th notes)
            },
            
            stopBGM() {
                this.isPlaying = false;
                if (this.bgmInterval) {
                    clearInterval(this.bgmInterval);
                    this.bgmInterval = null;
                }
            }
        };

        // ==========================================
        // VARIÁVEIS GLOBAIS E CONFIGURAÇÃO
        // ==========================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let GAME_WIDTH = window.innerWidth;
        let GAME_HEIGHT = window.innerHeight;
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;

        window.addEventListener('resize', () => {
            GAME_WIDTH = window.innerWidth;
            GAME_HEIGHT = window.innerHeight;
            canvas.width = GAME_WIDTH;
            canvas.height = GAME_HEIGHT;
        });

        // Controles de input
        const keys = {
            ArrowLeft: false,
            ArrowRight: false,
            ArrowUp: false,
            ArrowDown: false,
            Space: false
        };

        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight') keys.ArrowRight = true;
            if (e.code === 'ArrowUp') keys.ArrowUp = true;
            if (e.code === 'ArrowDown') keys.ArrowDown = true;
            if (e.code === 'Space') keys.Space = true;
        });

        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight') keys.ArrowRight = false;
            if (e.code === 'ArrowUp') keys.ArrowUp = false;
            if (e.code === 'ArrowDown') keys.ArrowDown = false;
            if (e.code === 'Space') keys.Space = false;
        });

        // ==========================================
        // CLASSES DO JOGO
        // ==========================================
        
        class Player {
            constructor() {
                this.width = 40;
                this.normalHeight = 60;
                this.crouchHeight = 30;
                this.height = this.normalHeight;
                
                this.x = 100;
                this.y = GAME_HEIGHT / 2;
                
                this.vx = 0;
                this.vy = 0;
                this.speed = 400; // pixels por segundo
                this.jumpForce = -700;
                this.gravity = 1500;
                
                this.grounded = false;
                this.isCrouching = false;
                this.facingRight = true;
                
                this.maxHealth = 3;
                this.health = this.maxHealth;
                this.invulnerableTimer = 0;
                
                this.isAttacking = false;
                this.attackDuration = 0.2; // segundos
                this.attackTimer = 0;
                this.attackCooldown = 0.4;
                this.attackCooldownTimer = 0;
                this.attackRange = 60;
                
                this.color = '#4da6ff'; // Azul
                this.crouchColor = '#2980b9'; // Azul mais escuro
            }

            update(dt, platforms, enemies) {
                // Timers
                if (this.invulnerableTimer > 0) this.invulnerableTimer -= dt;
                if (this.attackCooldownTimer > 0) this.attackCooldownTimer -= dt;
                
                // Lógica de Ataque
                if (keys.Space && this.attackCooldownTimer <= 0 && !this.isCrouching) {
                    this.isAttacking = true;
                    this.attackTimer = this.attackDuration;
                    this.attackCooldownTimer = this.attackCooldown;
                    audio.attack();
                }

                if (this.isAttacking) {
                    this.attackTimer -= dt;
                    if (this.attackTimer <= 0) {
                        this.isAttacking = false;
                    }
                    // Checar colisão do ataque com inimigos
                    this.checkAttackHits(enemies);
                }

                // Lógica de Agachar
                if (keys.ArrowDown && this.grounded && !this.isAttacking) {
                    if (!this.isCrouching) {
                        this.isCrouching = true;
                        this.y += this.normalHeight - this.crouchHeight; // Ajusta posição para não flutuar
                        this.height = this.crouchHeight;
                        audio.crouch();
                    }
                } else {
                    if (this.isCrouching) {
                        // Verifica se tem teto (neste jogo não, mas boa prática)
                        this.isCrouching = false;
                        this.y -= this.normalHeight - this.crouchHeight;
                        this.height = this.normalHeight;
                    }
                }

                // Lógica de Movimento X
                if (!this.isCrouching) {
                    if (keys.ArrowLeft) {
                        this.vx = -this.speed;
                        this.facingRight = false;
                    } else if (keys.ArrowRight) {
                        this.vx = this.speed;
                        this.facingRight = true;
                    } else {
                        this.vx = 0; // Para imediatamente se soltar
                    }
                } else {
                    this.vx = 0; // Não move enquanto agachado
                }

                // Lógica de Pulo
                if (keys.ArrowUp && this.grounded && !this.isCrouching) {
                    this.vy = this.jumpForce;
                    this.grounded = false;
                    audio.jump();
                }

                // Aplica gravidade
                this.vy += this.gravity * dt;

                // Move X e checa colisões horizontais (simples, focando no chão)
                this.x += this.vx * dt;
                
                // Move Y e checa colisões verticais
                this.y += this.vy * dt;
                this.grounded = false;

                for (let plat of platforms) {
                    // Colisão de caixa (AABB) simples com plataformas
                    if (this.x < plat.x + plat.w &&
                        this.x + this.width > plat.x &&
                        this.y < plat.y + plat.h &&
                        this.y + this.height > plat.y) {
                        
                        // Checa se estava caindo
                        if (this.vy > 0 && (this.y + this.height - this.vy * dt) <= plat.y + 5) {
                            this.grounded = true;
                            this.vy = 0;
                            this.y = plat.y - this.height;
                        }
                        // Neste estilo de jogo, ignoramos colisão de lado/teto para suavidade,
                        // a menos que bata de cara na plataforma e esteja abaixo dela
                        else if (this.vx > 0 && this.x + this.width > plat.x && this.y + this.height > plat.y + 10) {
                            this.x = plat.x - this.width;
                            this.vx = 0;
                        }
                    }
                }
            }

            checkAttackHits(enemies) {
                // Define a caixa de colisão do ataque (Hitbox)
                let hitX = this.facingRight ? this.x + this.width : this.x - this.attackRange;
                let hitY = this.y;
                let hitW = this.attackRange;
                let hitH = this.height;

                for (let i = enemies.length - 1; i >= 0; i--) {
                    let enemy = enemies[i];
                    if (hitX < enemy.x + enemy.w &&
                        hitX + hitW > enemy.x &&
                        hitY < enemy.y + enemy.h &&
                        hitY + hitH > enemy.y) {
                        // Inimigo atingido!
                        enemies.splice(i, 1);
                        audio.enemyDeath();
                        
                        // Bônus: cria pequenas partículas no local (simplificado desenhando um flash rápido)
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                    }
                }
            }

            takeDamage() {
                if (this.invulnerableTimer > 0) return;
                this.health--;
                this.invulnerableTimer = 1.5; // 1.5 segundos de invulnerabilidade
                this.vy = -300; // Knockback pra cima
                this.vx = this.facingRight ? -200 : 200; // Knockback pra trás
                audio.hit();
                updateHUD();
                
                if (this.health <= 0) {
                    gameOver();
                }
            }

            draw(ctx, cameraX) {
                // Pisca se estiver invulnerável
                if (this.invulnerableTimer > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
                    return; 
                }

                ctx.fillStyle = this.isCrouching ? this.crouchColor : this.color;
                ctx.fillRect(this.x - cameraX, this.y, this.width, this.height);

                // Desenha olhos para mostrar direção
                ctx.fillStyle = '#fff';
                let eyeX = this.facingRight ? this.x - cameraX + 25 : this.x - cameraX + 5;
                let eyeY = this.y + 10;
                ctx.fillRect(eyeX, eyeY, 10, 10);
                
                ctx.fillStyle = '#000';
                let pupilX = this.facingRight ? eyeX + 5 : eyeX;
                ctx.fillRect(pupilX, eyeY + 2, 5, 5);

                // Desenha o ataque (Hitbox)
                if (this.isAttacking) {
                    ctx.fillStyle = 'rgba(255, 255, 0, 0.7)'; // Amarelo translúcido
                    let hitX = this.facingRight ? this.x - cameraX + this.width : this.x - cameraX - this.attackRange;
                    ctx.fillRect(hitX, this.y, this.attackRange, this.height);
                    
                    // Rastro de "corte" branco
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(hitX, this.y + this.height/2 - 2, this.attackRange, 4);
                }
            }
        }

        class Platform {
            constructor(x, y, w, h) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                // Cores aleatórias para o topo e base da plataforma
                this.colorTop = '#2ecc71'; // Verde
                this.colorBase = '#8e44ad'; // Roxo escuro neon
            }
            
            draw(ctx, cameraX) {
                // Base
                ctx.fillStyle = this.colorBase;
                ctx.fillRect(this.x - cameraX, this.y + 10, this.w, this.h - 10);
                // Topo (Grama/Luz neon)
                ctx.fillStyle = this.colorTop;
                ctx.fillRect(this.x - cameraX, this.y, this.w, 10);
            }
        }

        class Enemy {
            constructor(x, y, platform) {
                this.w = 30;
                this.h = 30;
                this.x = x;
                this.y = y - this.h; // Nasce em cima da plataforma
                this.platform = platform; // Referência à plataforma em que está
                this.speed = 100 + Math.random() * 50;
                this.direction = Math.random() > 0.5 ? 1 : -1; // 1 direita, -1 esquerda
                this.color = '#ff3333';
            }

            update(dt) {
                this.x += this.speed * this.direction * dt;

                // Patrulha: se chegar na borda da plataforma, inverte
                if (this.x <= this.platform.x) {
                    this.x = this.platform.x;
                    this.direction = 1;
                } else if (this.x + this.w >= this.platform.x + this.platform.w) {
                    this.x = this.platform.x + this.platform.w - this.w;
                    this.direction = -1;
                }
            }

            draw(ctx, cameraX) {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - cameraX, this.y, this.w, this.h);
                
                // Rosto de bravo
                ctx.fillStyle = '#000';
                // Olhos (linhas diagonais)
                let renderX = this.x - cameraX;
                ctx.beginPath();
                ctx.moveTo(renderX + 5, this.y + 5);
                ctx.lineTo(renderX + 10, this.y + 12);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(renderX + 25, this.y + 5);
                ctx.lineTo(renderX + 20, this.y + 12);
                ctx.stroke();
                
                // Boca denteada (simplificada como retângulo)
                ctx.fillStyle = '#fff';
                ctx.fillRect(renderX + 8, this.y + 20, 14, 5);
            }
        }

        // ==========================================
        // ESTADO DO JOGO E GERAÇÃO PROCEDURAL
        // ==========================================
        
        let player;
        let platforms = [];
        let enemies = [];
        
        let cameraX = 0;
        let nextPlatformX = 0;
        let lastTime = 0;
        let isGameOver = false;
        let gameRunning = false;
        let distanceScore = 0;
        let maxDistance = 0;

        function initGame() {
            player = new Player();
            platforms = [];
            enemies = [];
            cameraX = 0;
            nextPlatformX = 0;
            distanceScore = 0;
            maxDistance = 0;
            isGameOver = false;

            // Cria chão inicial seguro
            platforms.push(new Platform(0, GAME_HEIGHT - 100, 800, GAME_HEIGHT));
            nextPlatformX = 800;
            
            updateHUD();
            audio.init();
            audio.startBGM();
        }

        function generateWorld() {
            // Gera plataformas à frente da câmera para criar a ilusão de infinito
            let rightEdge = cameraX + GAME_WIDTH + 500; // Gera 500px à frente

            while (nextPlatformX < rightEdge) {
                // Gap (buraco) aleatório entre plataformas
                let gap = 50 + Math.random() * 200; 
                
                // Largura aleatória da nova plataforma
                let pWidth = 200 + Math.random() * 400;
                
                // Altura (Y) aleatória, limitando para não ser impossível pular
                let minY = GAME_HEIGHT - 300;
                let maxY = GAME_HEIGHT - 50;
                let pY = GAME_HEIGHT - 150 + (Math.random() * 200 - 100); 
                pY = Math.max(minY, Math.min(maxY, pY));

                let newPlatform = new Platform(nextPlatformX + gap, pY, pWidth, GAME_HEIGHT);
                platforms.push(newPlatform);
                
                // Chance de nascer um inimigo (60%)
                if (Math.random() > 0.4) {
                    let enemyX = newPlatform.x + Math.random() * (newPlatform.w - 30);
                    enemies.push(new Enemy(enemyX, newPlatform.y, newPlatform));
                }

                nextPlatformX += gap + pWidth;
            }

            // Limpa plataformas e inimigos antigos que ficaram para trás da câmera
            platforms = platforms.filter(p => p.x + p.w > cameraX - 200);
            enemies = enemies.filter(e => e.x + e.w > cameraX - 200);
        }

        // ==========================================
        // LOOP PRINCIPAL DO JOGO
        // ==========================================

        function update(dt) {
            if (isGameOver || !gameRunning) return;

            // Força limite do dt para evitar problemas se a aba ficar inativa
            if (dt > 0.1) dt = 0.1; 

            player.update(dt, platforms, enemies);
            
            // Atualiza Inimigos
            for (let enemy of enemies) {
                enemy.update(dt);
            }

            // Checa Colisão Player x Enemy
            if (player.invulnerableTimer <= 0) {
                for (let enemy of enemies) {
                    // hitbox um pouco menor que o visual para ser justo
                    let px = player.x + 5, py = player.y + 5, pw = player.width - 10, ph = player.height - 10;
                    let ex = enemy.x + 5, ey = enemy.y + 5, ew = enemy.w - 10, eh = enemy.h - 10;

                    if (px < ex + ew &&
                        px + pw > ex &&
                        py < ey + eh &&
                        py + ph > ey) {
                        player.takeDamage();
                        break; // Toma dano de apenas um por frame
                    }
                }
            }

            // Atualiza Câmera
            // A câmera segue o jogador na horizontal, mantendo-o a 30% da tela da esquerda
            let targetCameraX = player.x - GAME_WIDTH * 0.3;
            // A câmera só anda para a direita no estilo Endless
            if (targetCameraX > cameraX) {
                cameraX = targetCameraX;
            }
            
            // Empurra o jogador junto se ele encostar na borda esquerda da tela visível
            if (player.x < cameraX) {
                player.x = cameraX;
                player.vx = 0; // Para de ir pra trás
            }

            // Gera novos blocos infinitamente
            generateWorld();

            // Atualiza Pontuação baseada na distância máxima alcançada
            if (player.x > maxDistance) {
                maxDistance = player.x;
                distanceScore = Math.floor(maxDistance / 10);
                document.getElementById('score').innerText = `Distância: ${distanceScore}m`;
            }

            // Checa Morte por queda (buraco)
            if (player.y > GAME_HEIGHT) {
                gameOver();
            }
        }

        function draw() {
            // Fundo
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            // Grade de fundo (efeito parallax simples)
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 1;
            let bgOffsetX = (cameraX * 0.5) % 100; // Parallax
            for (let i = -100; i < GAME_WIDTH + 100; i += 100) {
                ctx.beginPath();
                ctx.moveTo(i - bgOffsetX, 0);
                ctx.lineTo(i - bgOffsetX, GAME_HEIGHT);
                ctx.stroke();
            }

            // Desenha Plataformas
            for (let p of platforms) {
                p.draw(ctx, cameraX);
            }

            // Desenha Inimigos
            for (let e of enemies) {
                e.draw(ctx, cameraX);
            }

            // Desenha Player
            if (gameRunning) {
                player.draw(ctx, cameraX);
            }
        }

        function gameLoop(timestamp) {
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            update(dt);
            draw();

            requestAnimationFrame(gameLoop);
        }

        // ==========================================
        // UI E CONTROLE DE TELAS
        // ==========================================

        function updateHUD() {
            const hearts = document.querySelectorAll('.heart');
            hearts.forEach((h, index) => {
                if (index < player.health) {
                    h.classList.remove('empty');
                } else {
                    h.classList.add('empty');
                }
            });
        }

        function gameOver() {
            isGameOver = true;
            gameRunning = false;
            audio.stopBGM();
            
            // Toca vários sons dissonantes para morte
            audio.playTone(150, 'sawtooth', 0.5, 0.2);
            setTimeout(() => audio.playTone(100, 'square', 0.8, 0.2), 200);

            document.getElementById('hud').style.display = 'none';
            document.getElementById('finalScore').innerText = `Distância Alcançada: ${distanceScore}m`;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function startGame() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('hud').style.display = 'block';
            initGame();
            gameRunning = true;
            lastTime = performance.now();
        }

        // Botoes
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Permite reiniciar com botão R
        window.addEventListener('keydown', (e) => {
            if (isGameOver && (e.code === 'KeyR' || e.code === 'Enter')) {
                startGame();
            }
        });

        // Inicia loop visual (menus parados)
        requestAnimationFrame((timestamp) => {
            lastTime = timestamp;
            draw(); // Desenha tela preta inicial
            requestAnimationFrame(gameLoop);
        });

    </script>
</body>
</html>
